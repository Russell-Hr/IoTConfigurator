name: HeatControl CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: ESP32 PlatformIO build + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        working-directory: firmware
        run: pio run

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeatControl-firmware
          path: |
            firmware/.pio/build/esp32dev/firmware.bin
            firmware/.pio/build/esp32dev/bootloader.bin
            firmware/.pio/build/esp32dev/partitions.bin
          if-no-files-found: error
      - name: Run host contract tests
        run: python -m pip install pytest && pytest -q tests/test_contract.py

  android:
    name: Android Gradle build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Build APK and run tests
        working-directory: android/HeatControlApp
        run: gradle testDebugUnitTest assembleDebug --stacktrace
